name: Build macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to attach the installer to a tagged release

jobs:
  checks:
    # Quick sound checks on Linux; runs alongside the Mac build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libxext-dev libfreetype-dev libfontconfig1-dev
      - name: Build and run offline checks
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSN_BUILD_TESTS=ON
          cmake --build build --target SNSynthTests
          ./build/SNSynthTests

  build:
    # GitHub's Mac runners have had no capacity since Nov 2026, so the Mac
    # build only runs when started by hand (Actions tab > Run workflow) or on
    # a version tag. Day to day, builds are made on M's Mac.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSN_BUILD_TESTS=ON

      - name: Build plugin, app and tests
        run: cmake --build build --config Release --parallel 4 --target SNSynth_All SNSynthTests

      - name: Run offline checks
        run: ./build/SNSynthTests

      - name: Sign (ad-hoc) so macOS will load the plugins
        run: |
          ART="build/SNSynth_artefacts/Release"
          for b in "$ART/VST3/SN Synth.vst3" "$ART/AU/SN Synth.component" "$ART/Standalone/SN Synth.app"; do
            codesign --force --deep --sign - "$b"
          done

      - name: Validate the Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/SNSynth_artefacts/Release/AU/SN Synth.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Sn01 Snau

      - name: Build installer
        run: ./packaging/make-installer.sh build/SNSynth_artefacts/Release

      - uses: actions/upload-artifact@v4
        with:
          name: SN-Synth-macOS
          path: dist/*

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See README for install steps."
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
